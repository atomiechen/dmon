[project]
name = "python-dmon"
version = "0.5.0"
description = "A lightweight, cross-platform process manager for background tasks, local service stacks, and partial recovery."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Atomie CHEN", email = "atomic_cwh@163.com" }
]
requires-python = ">=3.8"
dependencies = [
    "colorama>=0.4.6",
    "psutil>=7.1.0",
    "python-dotenv>=1.0.1,<1.1",
    "pyyaml>=6.0.3",
    "termcolor>=2.4.0",
    "tomli>=2.2.1 ; python_full_version < '3.11'",
]
keywords = ["dmon", "process manager", "daemon", "background", "supervisor", "local development", "readiness", "service management", "coding agents"]

[project.urls]
"Homepage" = "https://github.com/atomiechen/dmon"
"Bug Tracker" = "https://github.com/atomiechen/dmon/issues"
Changelog = "https://github.com/atomiechen/dmon/blob/main/CHANGELOG.md"

[project.scripts]
dmon = "dmon.__main__:main"
python-dmon = "dmon.__main__:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dmon"

[dependency-groups]
dev = [
    "ruff>=0.13.3",
]
