name: Publish Python 🐍 distributions 📦

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        type: boolean
        default: false
        description: Publish to TestPyPI
      publish_pypi:
        type: boolean
        default: false
        description: Publish to PyPI
      publish_gh_release:
        type: boolean
        default: true
        description: Publish to GitHub Release
      use_changelog:
        type: boolean
        default: true
        description: Extract release notes from CHANGELOG.md
      changelog_file:
        type: string
        default: CHANGELOG.md
        description: Path to changelog file
        required: false
      release_tag:
        type: string
        description: Tag to package (empty for latest tag)
        required: false

permissions:
  contents: read

jobs:
  get-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set_release_tag.outputs.tag }}
    steps:
      - name: Check selected targets
        if: ${{ !inputs.publish_testpypi && !inputs.publish_pypi && !inputs.publish_gh_release }}
        run: |
          echo "All publish targets are disabled."
          exit 1
      - name: Verify and set release tag
        id: set_release_tag
        uses: atomiechen/reusable-workflows/.github/actions/verify-tag@dc0e552d0473b25ff8eccf3f32a97e26d17d5185 # verified tag resolver
        with:
          tag: ${{ inputs.release_tag }}

  build-n-publish:
    needs: get-tag
    permissions:
      contents: write # GitHub Release
      id-token: write # Sigstore for GitHub Release
    uses: atomiechen/reusable-workflows/.github/workflows/publish-python-distributions.yml@cbac983c5ec0c0a2b133a960d10a156a3d1bf069 # build validation and token-compatible publisher
    with:
      # PyPI uploads happen below, outside the reusable workflow.
      build_only: ${{ !inputs.publish_gh_release }}
      publish_testpypi: false
      publish_pypi: false
      publish_gh_release: ${{ inputs.publish_gh_release }}
      use_changelog: ${{ inputs.use_changelog }}
      changelog_file: ${{ inputs.changelog_file }}
      release_tag: ${{ needs.get-tag.outputs.release_tag }}

  publish-to-testpypi:
    if: ${{ inputs.publish_testpypi }}
    needs: build-n-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    if: ${{ inputs.publish_pypi }}
    needs: build-n-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
